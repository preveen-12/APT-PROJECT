<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - APT Radar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        if (!localStorage.getItem('currentUser')) { window.location.href = '/login-page'; }
    </script>
</head>
<body class="bg-[#0f0f1a] text-slate-200 min-h-screen flex flex-col items-center justify-center p-6">
    <div class="absolute top-6 right-6">
        <button onclick="localStorage.clear(); window.location.href='/';" class="text-red-400 text-xs border border-red-900 p-2 rounded">LOGOUT</button>
    </div>
    <h1 class="text-4xl font-bold text-purple-400 mb-10">COMMAND CENTER</h1>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 w-full max-w-4xl">
        <a href="/url-page" class="bg-[#16213e] p-10 rounded-2xl border border-purple-500/30 hover:border-purple-500 transition-all text-center">
            <h2 class="text-xl font-bold mb-2">URL SCANNER</h2>
            <p class="text-slate-400 text-sm">Analyze suspicious links</p>
        </a>
        <a href="/file-page" class="bg-[#16213e] p-10 rounded-2xl border border-purple-500/30 hover:border-purple-500 transition-all text-center">
            <h2 class="text-xl font-bold mb-2">FILE ANALYZER</h2>
            <p class="text-slate-400 text-sm">Check file hashes for threats</p>
        </a>
    </div>
</body>
</html>
