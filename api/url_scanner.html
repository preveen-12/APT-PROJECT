<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Scanner - APT Radar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: radial-gradient(circle at center, #1a1a2e 0%, #0f0f1a 100%); }
        .glow { box-shadow: 0 0 15px rgba(139, 92, 246, 0.3); }
    </style>
    <script>
        // Gatekeeper: Redirect if no operator session is found
        if (!localStorage.getItem('currentUser')) {
            window.location.href = '/'; 
        }
    </script>
</head>
<body class="text-slate-200 min-h-screen flex flex-col items-center justify-center p-6">
    <div class="w-full max-w-xl mb-4 text-left flex justify-between items-center">
        <a href="/dashboard" class="text-purple-400 hover:text-lavender-300 text-sm font-medium transition-all flex items-center gap-2">
            <span>←</span> Back to Command Center
        </a>
        <span id="operatorDisplay" class="text-[10px] text-slate-500 uppercase tracking-widest font-mono"></span>
    </div>

    <div class="bg-[#16213e]/50 border border-purple-500/30 p-8 rounded-2xl glow w-full max-w-xl backdrop-blur-md text-center">
        <h2 class="text-2xl font-bold text-purple-300 mb-6 uppercase tracking-tight">URL Analysis Engine</h2>
        <input type="text" id="urlField" placeholder="Paste suspicious URL here..." 
            class="w-full bg-[#0f0f1a] border border-purple-900/50 p-4 rounded-lg mb-4 focus:outline-none focus:border-purple-500 text-purple-300 transition-all">
        <button onclick="scanUrl()" id="scanBtn" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-3 rounded-lg shadow-lg transition-all active:scale-95">
            SCAN LINK
        </button>
    </div>

    <div class="mt-10 w-full max-w-xl">
        <h3 class="text-purple-400 text-sm font-bold mb-4 uppercase tracking-widest text-center">Personal Scan History</h3>
        <div id="historyList" class="space-y-3">
            <p class="text-center text-slate-500 text-xs italic">No recent scans found.</p>
        </div>
    </div>

    <script>
        // Display Operator Identity
        document.getElementById('operatorDisplay').innerText = `ID: ${localStorage.getItem('currentUser')}`;

        async function loadHistory() {
            const user = localStorage.getItem('currentUser');
            try {
                const res = await fetch(`/history?scan_type=URL&user=${user}`);
                const logs = await res.json();
                const container = document.getElementById('historyList');
                
                if (logs.length > 0) {
                    container.innerHTML = logs.map(log => `
                        <div class="bg-[#16213e]/40 p-4 rounded-xl border-l-4 border-purple-600 backdrop-blur-sm hover:bg-[#16213e]/60 transition-all">
                            <p class="text-purple-300 font-mono text-xs break-all mb-2">${log.target}</p>
                            <div class="flex justify-between items-center text-[10px] text-slate-400">
                                <span class="font-bold uppercase">${log.result}</span>
                                <span>${new Date(log.timestamp).toLocaleString()}</span>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (err) { console.log("History stream interrupted."); }
        }

        async function scanUrl() {
            const urlInput = document.getElementById('urlField').value;
            const user = localStorage.getItem('currentUser');
            const btn = document.getElementById('scanBtn');

            if (!urlInput) return alert("System Error: No URL provided for analysis.");
            
            btn.innerText = "ANALYZING...";
            btn.disabled = true;

            try {
                const response = await fetch(`/scan-url?url=${encodeURIComponent(urlInput)}&user=${user}`);
                const data = await response.json();
                
                if (data.data) {
                    const stats = data.data.attributes.last_analysis_stats;
                    alert(`RADAR REPORT GENERATED\n----------------------\nTarget: ${urlInput}\nMalicious: ${stats.malicious}\nHarmless: ${stats.harmless}`);
                    loadHistory(); 
                } else { 
                    alert(data.message || "Scan in progress... Check history in a moment."); 
                }
            } catch (err) { 
                alert("Communication Error: Backend Radar is offline."); 
            } finally {
                btn.innerText = "SCAN LINK";
                btn.disabled = false;
            }
        }

        window.onload = loadHistory;
    </script>
</body>
</html>
