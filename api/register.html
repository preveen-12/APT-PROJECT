<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - APT Radar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: radial-gradient(circle at center, #1a1a2e 0%, #0f0f1a 100%); }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex items-center justify-center p-6">
    <div class="bg-[#16213e]/80 p-8 rounded-2xl border border-purple-500/30 w-full max-w-md backdrop-blur-md">
        <h2 class="text-2xl font-bold text-purple-300 mb-6 text-center uppercase tracking-widest">Register Operator</h2>
        <input type="text" id="user" placeholder="Choose Username" class="w-full bg-[#0f0f1a] border border-purple-900/50 p-4 rounded-lg mb-4 text-purple-300 focus:outline-none focus:border-purple-500">
        <input type="password" id="pass" placeholder="Set Password" class="w-full bg-[#0f0f1a] border border-purple-900/50 p-4 rounded-lg mb-6 text-purple-300 focus:outline-none focus:border-purple-500">
        <button onclick="doRegister()" class="w-full bg-purple-600 hover:bg-purple-500 py-3 rounded-lg font-bold transition-all">INITIALIZE ACCOUNT</button>
        <p class="text-center mt-4 text-xs text-slate-500">Already have access? <a href="/login-page" class="text-purple-400 hover:underline">Login</a></p>
    </div>

    <script>
async function doRegister() {
    const username = document.getElementById('user').value;
    const password = document.getElementById('pass').value;

    if (!username || !password) {
        alert("Please fill in both fields.");
        return;
    }

    try {
        // Use window.location.origin to ensure it hits the Render backend correctly
        const response = await fetch(`${window.location.origin}/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (response.ok) {
            alert("Operator Registered! Redirecting to Login...");
            window.location.href = '/login-page';
        } else {
            alert("Registration Failed: " + (data.detail || "Unknown error"));
        }
    } catch (err) {
        console.error("Fetch error:", err);
        // This message helps you know if the server is just sleeping
        alert("System Link Failure: The Command Center is currently waking up. Please wait 30 seconds and try again.");
    }
}
</script>
</body>
</html>
