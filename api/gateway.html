<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gateway - APT Radar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: radial-gradient(circle at center, #1a1a2e 0%, #0f0f1a 100%); }
        .glow-btn { box-shadow: 0 0 15px rgba(139, 92, 246, 0.4); }
        .radar-grid { background-image: radial-gradient(#2d1b4e 1px, transparent 1px); background-size: 30px 30px; }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col items-center justify-center p-6 radar-grid">
    <div class="text-center mb-12">
        <div class="text-6xl mb-6 animate-pulse">🛡️</div>
        <h1 class="text-5xl font-black tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-lavender-300 mb-4">
            APT RADAR SYSTEM
        </h1>
        <p class="text-slate-400 uppercase tracking-[0.3em] text-xs">Access Restricted: Authorization Required</p>
    </div>

    <div class="flex flex-col gap-6 w-full max-w-md">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 w-full">
            <a href="/login-page" class="bg-purple-600 hover:bg-purple-500 text-white font-bold py-4 rounded-xl text-center transition-all glow-btn uppercase tracking-widest">
                Login
            </a>
            <a href="/register-page" class="bg-[#16213e] border border-purple-500/50 hover:border-purple-400 text-purple-300 font-bold py-4 rounded-xl text-center transition-all uppercase tracking-widest">
                Register
            </a>
        </div>

        <button onclick="enterAsGuest()" class="text-slate-500 hover:text-purple-400 text-[10px] uppercase tracking-[0.2em] transition-colors">
            -- Continue as Guest (Bypass Mode) --
        </button>
    </div>

    <script>
        function enterAsGuest() {
            localStorage.setItem('currentUser', 'Guest_Operator');
            window.location.href = '/dashboard';
        }
    </script>

    <footer class="mt-20 text-[10px] text-slate-600 uppercase tracking-widest">
        &copy; 2026 APT Detection Radar • Tadepalli Command Center
    </footer>
</body>
</html>
